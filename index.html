<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splatlight</title>
<style>
  :root { color-scheme: dark; --bg: #111; --panel: #1b1b1b; --line: #333; --text: #ddd; --muted: #888; --err: #f77; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 290px; height: 100vh; }
  main { position: relative; min-width: 0; }
  #view { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #status { position: absolute; left: 8px; top: 6px; color: var(--muted); }
  #status.error { color: var(--err); right: 8px; }
  #timers { position: absolute; left: 8px; bottom: 6px; margin: 0; padding: 6px 8px; background: #000a; font: 11px/1.35 ui-monospace, monospace; white-space: pre; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 6px 10px; }
  fieldset { border: 1px solid var(--line); margin: 6px 0; padding: 4px 8px 6px; }
  legend { color: var(--muted); padding: 0 4px; }
  .row { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 6px; margin: 3px 0; }
  .row input[type=range], .row select { width: 100%; }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row button { grid-column: 1 / -1; }
  .intro { padding: 4px 0 6px; border-bottom: 1px solid var(--line); }
  .intro h1 { font-size: 15px; margin: 2px 0 4px; }
  .intro p { margin: 0 0 6px; color: var(--muted); }
  .intro a { color: var(--text); }
  body:not(.debug-on) .debug, body:not(.debug-on) #timers { display: none; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <canvas id="view"></canvas>
  <div id="status">Starting…</div>
  <pre id="timers"></pre>
</main>
<aside id="panel">
  <div class="intro">
    <h1>Splatlight</h1>
    <p>Fully relightable volumetric Gaussian splats in WebGPU. Every Gaussian carries material properties and is lit
    live by emissive Gaussian lights, sky and sun, with shadows and bounce light. Drag to orbit, shift- or right-drag
    to pan, wheel to dolly.</p>
  </div>
</aside>
<script type="module" src="src/main.js"></script>
</body>
</html>
